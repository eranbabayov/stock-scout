services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_scout_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stock_scout}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - stock_scout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stock_scout}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stock_scout_pgdata:
