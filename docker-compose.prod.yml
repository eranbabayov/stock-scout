# Full production stack: nginx (static frontend + reverse proxy), the
# backend (API + Telegram bot), and Postgres. Copy .env.prod.example to
# .env.prod, fill it in, then:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# ...or, to run the images published by CI instead of building locally, set
# BACKEND_IMAGE and FRONTEND_IMAGE in .env.prod to their ghcr.io tags and run:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

# Explicit project name so this never collides with the dev docker-compose.yml
# stack (which has its own "postgres" service) when both are run from the
# same directory — without this, Compose derives the project name from the
# directory and the two files' same-named services fight over one container.
name: stock-scout-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-scout-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - stock_scout_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ${BACKEND_IMAGE:-stock-scout-backend:local}
    container_name: stock-scout-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      # Internal service-to-service connection — always "postgres" (the
      # compose service name), regardless of what host/port .env.prod's
      # DATABASE_URL (if any) points at for local tooling.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Not published to the host — only nginx (below) is publicly reachable.
    # nginx.conf proxies /api/ to this service by its Compose DNS name.
    expose:
      - "4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: ${FRONTEND_IMAGE:-stock-scout-frontend:local}
    container_name: stock-scout-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  stock_scout_pgdata_prod:
